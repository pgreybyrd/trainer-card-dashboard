;~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
;MONEY = Date
;NON-US Date format: ddmmyyyy
;~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

[MoneySymbol]
Meter=Image
ImageName=images\misc\money
x=131
y=132

;~~~~~~~~~~~~~~~
;DAY & MONTH
;~~~~~~~~~~~~~~~

[CurrentDay]
Measure=Time
Format=%d
;Format=%S


[Day10Measure]
Measure=Calc
Formula=Trunc(([CurrentDay] % 100) / 10)
DynamicVariables=1

[Day01Measure]
Measure=Calc
Formula=([CurrentDay] % 10)
DynamicVariables=1

[CurrentMonth]
Measure=Time
Format=%m

[Month10Measure]
Measure=Calc
Formula=Trunc(([CurrentMonth] % 100) / 10)
DynamicVariables=1

[Month01Measure]
Measure=Calc
Formula=([CurrentMonth] % 10)
DynamicVariables=1

;-----
;DRAW
;----- 
[Month10]
Meter=Image
MeasureName=Month10Measure
x=12r
y=0r

[Month01]
Meter=Image
MeasureName=Month01Measure
x=12r
y=0r 

[Day10]
Meter=Image
MeasureName=Day10Measure
x=12r
y=0r

[Day01]
Meter=Image
MeasureName=Day01Measure
x=11r
y=0r



;~~~~~~~~~~~~~~~
;YEAR
;~~~~~~~~~~~~~~~

[CurrentYear]
Measure=Time
Format=%Y

[Year1000]
Measure=Calc
Formula=Trunc([CurrentYear]/1000)
DynamicVariables=1

[Year0100]
Measure=Calc
Formula=Trunc(([CurrentYear] % 1000) / 100)
DynamicVariables=1

[Year0010]
Measure=Calc
Formula=Trunc(([CurrentYear] % 100) / 10)
DynamicVariables=1

[Year0001]
Measure=Calc
Formula=([CurrentYear]%10)
DynamicVariables=1

;-----
;DRAW
;-----

[Year1000Meter]
Meter=Image
MeasureName=Year1000
DynamicVariables=1
x=13r
y=0r

[Year0100Meter]
Meter=Image
MeasureName=Year0100
DynamicVariables=1
x=12r
y=0r

[Year0010Meter]
Meter=Image
MeasureName=Year0010
DynamicVariables=1
x=12r
y=0r

[Year0001Meter]
Meter=Image
MeasureName=Year0001
DynamicVariables=1
x=12r
y=0r
;~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



;~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
;Pokedex = Recycling percentage left
;789 = empty (total amount of pokemon in ruby/sapphire)
;0 = full
;~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
[MeasureTrash]
Measure=Plugin
Plugin=RecycleManager
MinValue=0
MaxValue=719
InvertMeasure=1

[TrashCanIcon]
Meter=Image
ImageName=images\misc\trashcan
x=136
y=161
LeftMouseUpAction=[!CommandMeasure MeasureTrash "OpenBin"]
RightMouseUpAction=[!CommandMeasure MeasureTrash "EmptyBin"]
ToolTipText=Left-click to open Recycle Bin#CRLF#Right-click to empty Recycle Bin

[MeasureTrashHundreds]
Measure=Calc
Formula=Floor([MeasureTrash] / 100)
DynamicVariables=1

[MeasureTrashTens]
Measure=Calc
Formula=Floor(([MeasureTrash] % 100) / 10)
DynamicVariables=1

[MeasureTrashOnes]
Measure=Calc
Formula=Floor([MeasureTrash] % 10)
DynamicVariables=1

[DisplayMeasureTrashOnes]
Meter=Image
MeasureName=MeasureTrashOnes
x=227
y=164

[DisplayMeasureTrashTens]
Meter=Image
MeasureName=MeasureTrashTens
x=-12r
y=0r

[DisplayMeasureTrashHundreds]
Meter=Image
MeasureName=MeasureTrashHundreds
x=-12r
y=0r
;~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



;~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
;PLAYTIME = CLOCK
;~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
[CurrentHour]
Measure=Time
Format=%H

[HourTens]
Measure=Calc
Formula=Floor([CurrentHour]/10)
DynamicVariables=1

[HourOnes]
Measure=Calc
Formula=([CurrentHour]%10)
DynamicVariables=1

[CurrentMinute]
Measure=Time
Format=%M

[MinuteTens]
Measure=Calc
Formula=Floor([CurrentMinute]/10)
DynamicVariables=1

[MinuteOnes]
Measure=Calc
Formula=([CurrentMinute]%10)
DynamicVariables=1

[MeterHourTens]
Meter=Image
MeasureName=HourTens
DynamicVariables=1
x=179
y=196

[MeterHourOnes]
Meter=Image
MeasureName=HourOnes
DynamicVariables=1
x=12r
y=0r

[ToggleTimer]
Measure=Calc
Formula=(ToggleTimer + 1) % 2
UpdateDivider=1

[ToggleColon]
Meter=Image
ImageName=images\misc\colon
;Hidden=0
x=12r
y=0r

;COMMENT OUT [ToggleImageVisibility] if you don't want flashing colon between hour and minutes
[ToggleImageVisibility]
Measure=Calc
Formula=[ToggleTimer]
IfEqualValue=0
IfEqualAction=[!HideMeter ToggleColon][!UpdateMeter ToggleColon][!Redraw]
IfAboveValue=0
IfAboveAction=[!ShowMeter ToggleColon][!UpdateMeter ToggleColon][!Redraw]
DynamicVariables=1

[MeterMinuteTens]
Meter=Image
MeasureName=MinuteTens
DynamicVariables=1
x=12r
y=0r

[MeterMinuteOnes]
Meter=Image
MeasureName=MinuteOnes
ImageName="#@#Images\[MinuteOnes].png"
DynamicVariables=1
x=12r
y=0r
;~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



;~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
;Pokeball = an icon to click
;in this case takes me to a TODO folder
;~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
[PokeballClick]
Meter=Image
SolidColor=255,255,255,1
w=36
h=24
x=235
y=36
;TO CHANGE THE ACTION ON LEFT CLICK CHANGE THE THING HERE
;EXAMPLE - [C:\WHATEVER\WHATEVER]
;LEAVE EMPTY FOR NO ACTION
LeftMouseUpAction=[#MasterballPath#]
;LABEL WHAT MOUSE CLICKS DO
ToolTipText=Left-click to open Calorie Counter
;#CRLF#Right-click to empty

[PokeballIcon]
Meter=Image
;TO CHANGE THE ICON CHANGE THE NAME TO WHATEVER ITEM YOU WANT FROM THE FOLDER
;LEAVE EMPTY TO LEAVE TAB EMPTY
ImageName=images\balls\masterball
x=6r
y=0r
