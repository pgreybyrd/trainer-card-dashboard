;~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
;PLAYTIME = CLOCK
;~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
[CurrentHour]
Measure=Time
Format=%H

[HourTens]
Measure=Calc
Formula=Floor([CurrentHour]/10)
DynamicVariables=1

[HourOnes]
Measure=Calc
Formula=([CurrentHour]%10)
DynamicVariables=1

[CurrentMinute]
Measure=Time
Format=%M

[MinuteTens]
Measure=Calc
Formula=Floor([CurrentMinute]/10)
DynamicVariables=1

[MinuteOnes]
Measure=Calc
Formula=([CurrentMinute]%10)
DynamicVariables=1

[MeterHourTens]
Meter=Image
MeasureName=HourTens
;ImageName=0
DynamicVariables=1
x=179
y=196

[MeterHourOnes]
Meter=Image
MeasureName=HourOnes
;ImageName=0
DynamicVariables=1
x=12r
y=0r

[ToggleTimer]
Measure=Calc
Formula=(ToggleTimer + 1) % 2
UpdateDivider=1

