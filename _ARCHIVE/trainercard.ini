;~~~~~~~~~~~YEAR~~~~~~~~~~~
[CurrentYear]
Measure=Time
Format=%Y

[Year1000]
Measure=Calc
Formula=Trunc([CurrentYear]/1000)
DynamicVariables=1

[Year0100]
Measure=Calc
Formula=([CurrentYear]-((Trunc([CurrentYear]/1000))*1000))/100
DynamicVariables=1

[Year0010]
Measure=Calc
Formula=([CurrentYear]-((Trunc([CurrentYear]/1000))*1000))/10
DynamicVariables=1

[Year0001]
Measure=Calc
Formula=([CurrentYear]%10)
DynamicVariables=1

[Year1000Meter]
Meter=Image
MeasureName=Year1000
DynamicVariables=1
x=12r
y=0r

[Year0100Meter]
Meter=Image
MeasureName=Year0100
DynamicVariables=1
x=12r
y=0r

[Year0010Meter]
Meter=Image
MeasureName=Year0010
DynamicVariables=1
x=12r
y=0r

[Year0001Meter]
Meter=Image
MeasureName=Year0001
DynamicVariables=1
x=12r
y=0r
