;~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
;Pokedex = Recycling percentage left
;100 = empty
;0 = full
;~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
[MeasureTrash]
Measure=Plugin
Plugin=RecycleManager
MinValue=0
MaxValue=719
InvertMeasure=1

[TrashCanIcon]
Meter=Image
ImageName=trashcan
x=136
y=161
LeftMouseUpAction=[!CommandMeasure MeasureTrash "OpenBin"]
RightMouseUpAction=[!CommandMeasure MeasureTrash "EmptyBin"]
ToolTipText=Left-click to open#CRLF#Right-click to empty

[TrashPercentageOnes]
Meter=Calc
Formula=[MeasureTrash]

[TrashPercentageTens]
Meter=Calc
Formula=Floor([MeasureTrash]/100)

[TrashPercentageHundreds]
Meter=Calc
Formula=Floor([MeasureTrash]/100)

[DisplayTrashPercentageOnes]
Meter=Image
ImageName=9
;MeasureName=MeasureTrash
x=227
y=164

[DisplayTrashPercentageTens]
Meter=Image
ImageName=8
;MeasureName=1
x=-12r
y=0r

[DisplayTrashPercentageHundreds]
Meter=Image
ImageName=7
MeasureName=TrashPercentageHundreds
x=-12r
y=0r

;*******************************************************************
;TEST
[TestString]
Meter=String
MeasureName=MeasureTrash
;MeasureName=TrashPercentageOnes
;MeasureName=TrashPercentageTens
;MeasureName=TrashPercentageHundreds
X=0r
Y=50r
FontColor=100,100,100,100
FontSize=20
AntiAlias=1
Text="Trash: %1"
;*******************************************************************
