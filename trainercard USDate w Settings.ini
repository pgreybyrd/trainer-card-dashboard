x=131
y=132

;~~~~~~~~~~~~~~~
;DAY & MONTH
;~~~~~~~~~~~~~~~

[CurrentDay]
Measure=Time
Format=%d
;Format=%S


[Day10Measure]
Measure=Calc
Formula=Trunc(([CurrentDay] % 100) / 10)
DynamicVariables=1

[Day01Measure]
Measure=Calc
Formula=([CurrentDay] % 10)
DynamicVariables=1

[CurrentMonth]
Measure=Time
Format=%m

[Month10Measure]
Measure=Calc
Formula=Trunc(([CurrentMonth] % 100) / 10)
DynamicVariables=1

[Month01Measure]
Measure=Calc
Formula=([CurrentMonth] % 10)
DynamicVariables=1

;-----
;DRAW
;----- 
[Month10]
Meter=Image
MeasureName=Month10Measure
x=12r
y=0r

