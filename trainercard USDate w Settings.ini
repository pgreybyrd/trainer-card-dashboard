;~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



;~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
;Pokedex = Recycling percentage left
;789 = empty (total amount of pokemon in ruby/sapphire)
;0 = full
;~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
[MeasureTrash]
Measure=Plugin
Plugin=RecycleManager
MinValue=0
MaxValue=719
InvertMeasure=1

[TrashCanIcon]
Meter=Image
ImageName=trashcan
x=136
y=161
LeftMouseUpAction=[!CommandMeasure MeasureTrash "OpenBin"]
RightMouseUpAction=[!CommandMeasure MeasureTrash "EmptyBin"]
ToolTipText=Left-click to open#CRLF#Right-click to empty

[MeasureTrashHundreds]
Measure=Calc
Formula=Floor([MeasureTrash] / 100)
DynamicVariables=1

[MeasureTrashTens]
Measure=Calc
Formula=Floor(([MeasureTrash] % 100) / 10)
DynamicVariables=1

[MeasureTrashOnes]
Measure=Calc
Formula=Floor([MeasureTrash] % 10)
DynamicVariables=1

[DisplayMeasureTrashOnes]
Meter=Image
;ImageName=9
MeasureName=MeasureTrashOnes
x=227
y=164

[DisplayMeasureTrashTens]
Meter=Image
;ImageName=8
MeasureName=MeasureTrashTens
x=-12r
y=0r

[DisplayMeasureTrashHundreds]
Meter=Image
;ImageName=7
MeasureName=MeasureTrashHundreds
x=-12r
y=0r
;~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



;~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
;PLAYTIME = CLOCK
;~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
[CurrentHour]
Measure=Time
Format=%H

[HourTens]
Measure=Calc
Formula=Floor([CurrentHour]/10)
DynamicVariables=1

[HourOnes]
Measure=Calc
Formula=([CurrentHour]%10)
DynamicVariables=1

[CurrentMinute]
Measure=Time
Format=%M

[MinuteTens]
Measure=Calc
Formula=Floor([CurrentMinute]/10)
DynamicVariables=1

[MinuteOnes]
Measure=Calc
Formula=([CurrentMinute]%10)
DynamicVariables=1

[MeterHourTens]
Meter=Image
MeasureName=HourTens
;ImageName=0
DynamicVariables=1
x=179
y=196

[MeterHourOnes]
Meter=Image
MeasureName=HourOnes
;ImageName=0
DynamicVariables=1
x=12r
y=0r

[ToggleTimer]
Measure=Calc
Formula=(ToggleTimer + 1) % 2
UpdateDivider=1

[ToggleColon]
Meter=Image
ImageName=colon
;Hidden=0
x=12r
y=0r

;COMMENT OUT [ToggleImageVisibility] if you don't want flashing colon between hour and minutes
[ToggleImageVisibility]
Measure=Calc
Formula=[ToggleTimer]
IfEqualValue=0
IfEqualAction=[!HideMeter ToggleColon][!UpdateMeter ToggleColon][!Redraw]
IfAboveValue=0
IfAboveAction=[!ShowMeter ToggleColon][!UpdateMeter ToggleColon][!Redraw]
DynamicVariables=1

[MeterMinuteTens]
Meter=Image
MeasureName=MinuteTens
;ImageName=0
DynamicVariables=1
x=12r
y=0r

[MeterMinuteOnes]
Meter=Image
MeasureName=MinuteOnes
ImageName="#@#Images\[MinuteOnes].png"
DynamicVariables=1
x=12r
y=0r
