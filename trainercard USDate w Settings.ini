MeasureName=Day01Measure
x=11r
y=0r



;~~~~~~~~~~~~~~~
;YEAR
;~~~~~~~~~~~~~~~

[CurrentYear]
Measure=Time
Format=%Y

[Year1000]
Measure=Calc
Formula=Trunc([CurrentYear]/1000)
DynamicVariables=1

[Year0100]
Measure=Calc
Formula=Trunc(([CurrentYear] % 1000) / 100)
DynamicVariables=1

[Year0010]
Measure=Calc
Formula=Trunc(([CurrentYear] % 100) / 10)
DynamicVariables=1

[Year0001]
Measure=Calc
Formula=([CurrentYear]%10)
DynamicVariables=1

