;~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
;Close Settings
;~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
[MeterCloseButtonPassive]
Meter=String
StringAlign=Left
FontFace=#FontFace#
FontSize=15
FontColor=#ForegroundColor#
X=60
Y=10r
Text=Close Settings
SolidColor=0,0,0,1
AntiAlias=1
MouseOverAction=!Execute [!ShowMeter MeterCloseButtonActive][!HideMeter MeterCloseButtonPassive][!Update]

[MeterCloseButtonActive]
Meter=String
StringAlign=Left
FontFace=#FontFace#
FontSize=15
FontWeight=800
FontColor=255,255,255
X=r
Y=r
Text=> Close Settings
SolidColor=0,0,0,1
AntiAlias=1
Hidden=1
InlineSetting=Shadow | 0 | 0 | 4.5 | 254,255,214
LeftMouseUpAction=[!DeactivateConfig "Pokemon Trainer Card\Settings" "settings.ini"][!ShowMeter MeterCloseButtonPassive][!HideMeter MeterCloseButtonActive][!Update]
MouseLeaveAction=!Execute [!ShowMeter MeterCloseButtonPassive][!HideMeter MeterCloseButtonActive][!Update]


[Rainmeter]
Update=1000
WindowX=(#SCREENAREAWIDTH# - 480)
WindowY=0
KeepOnScreen=1

